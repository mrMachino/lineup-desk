name: Lineup Desk

on:
  schedule:
    # Times are UTC. Set for Eastern Standard Time (Nov-Mar); during daylight time they run 1 hour later.
    - cron: "47 12 * * *"    # every morning, 7:47 AM ET
    - cron: "45 16 * * 0"    # Sunday 11:45 AM ET, right after inactives for the 1 PM games
  workflow_dispatch:          # "Run workflow" button = refresh now
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lineup-desk
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Sleeper player list (pulled once a day) + last alert, so you don't get repeats
      - uses: actions/cache@v4
        with:
          path: .cache
          key: lineup-desk-${{ github.run_id }}
          restore-keys: lineup-desk-

      - name: Pull leagues, build page, send alerts
        run: python monitor.py --site site
        env:
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          YAHOO_CONSUMER_KEY: ${{ secrets.YAHOO_CONSUMER_KEY }}
          YAHOO_CONSUMER_SECRET: ${{ secrets.YAHOO_CONSUMER_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
